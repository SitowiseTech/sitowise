[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./out" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[fuzz]
runs = 512

[invariant]
runs = 256
depth = 128
fail_on_revert = true
shrink_run_limit = 5000
